# Netlify build config. The Node version lives in .nvmrc so that `nvm use` locally and
# Netlify's build image read the same file — do not add NODE_VERSION here or as a site
# environment variable, either would win over .nvmrc and the two would drift.
#
# Not settable from this file: which branch is production. That is a site setting
# (Build & deploy -> Branches and deploy contexts -> Production branch).

[build]
  command = "npm run build"
  publish = "dist"

# `netlify dev` proxies the Astro dev server rather than serving ./dist, so the local URL
# behaves like the deployed site (headers and redirects below are applied) while keeping HMR.
[dev]
  command = "npm run dev"
  targetPort = 4321
  framework = "#custom"
  autoLaunch = false

# Astro fingerprints every file it emits into /_astro/, so those URLs never change contents.
# Netlify's default is `max-age=0, must-revalidate`; this turns repeat visits into cache hits.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are fetched from Google Fonts, and images are unfingerprinted files in public/,
# so they get a shorter TTL than the hashed assets above.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
